75, 0.5]};
const REF = { cx: 196, cy: 170, extent: 222 };
const DEG = 5;

const PARAMS = {
  thickness: 5.0,     // slab thickness (reference px)
  bevel: 4.0,         // radius of the rounded bevel (reference px)
  tiltX: 0.42,        // how far the sheet faces left (exposes the right-hand sides)
  tiltY: 0.55,        // how far the sheet faces up (exposes the bottom sides)
  wave: 0.3,          // depth of the cloth wave, relative to its on-screen ripple
  lightAz: 25,        // key light azimuth (deg, 0 = from the viewer, + = from the right)
  lightEl: 10,        // key light elevation (deg, + = from above)
  specular: 0.35,
  shininess: 60,
};
const RANGES = {
  thickness: [1, 12, 0.5], bevel: [1, 10, 0.5], tiltX: [0, 1.2, 0.02], tiltY: [0, 1.2, 0.02], wave: [0, 3, 0.05],
  lightAz: [-90, 90, 1], lightEl: [-60, 80, 1], specular: [0, 1.5, 0.05], shininess: [5, 200, 1],
};

// ---------- Geometry ----------
function bez(P, t) {
  const s = 1 - t;
  return [s*s*s*P[0][0] + 3*s*s*t*P[1][0] + 3*s*t*t*P[2][0] + t*t*t*P[3][0],
          s*s*s*P[0][1] + 3*s*s*t*P[1][1] + 3*s*t*t*P[2][1] + t*t*t*P[3][1]];
}
// The flag's centre line drift, used to turn the on-screen ripple into a depth wave
const chord = (P, t) => [P[0][0] + (P[3][0] - P[0][0]) * t, P[0][1] + (P[3][1] - P[0][1]) * t];

// Point on the flag sheet in 3D. x, y match the fitted outline; z tilts the sheet
// toward the viewer and carries the wave, so normals ripple like cloth.
function sheet(U, V) {
  const T = bez(MODEL.top, U), B = bez(MODEL.bottom, U);
  const x = T[0] + (B[0] - T[0]) * V, y = T[1] + (B[1] - T[1]) * V;
  const ripple = ((T[1] - chord(MODEL.top, U)[1]) * (1 - V) + (B[1] - chord(MODEL.bottom, U)[1]) * V);
  const z = PARAMS.tiltX * (x - REF.cx) + PARAMS.tiltY * (y - REF.cy) - PARAMS.wave * ripple;
  return [x, y, z];
}

const sub = (a, b) => [a[0]-b[0], a[1]-b[1], a[2]-b[2]];
const cross = (a, b) => [a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]];
const len = a => Math.hypot(a[0], a[1], a[2]);
const norm = a => { const l = len(a); return [a[0]/l, a[1]/l, a[2]/l]; };

// Samples across a pane: dense through the bevels, coarser across the face
function paneSamples(r) {
  const out = [];
  const bev = 12, mid = 36;
  for (let i = 0; i < bev; i++) out.push(r * (1 - Math.cos((i / bev) * Math.PI / 2)));
  for (let i = 0; i <= mid; i++) out.push(r + (1 - 2 * r) * i / mid);
  for (let i = bev - 1; i >= 0; i--) out.push(1 - r * (1 - Math.cos((i / bev) * Math.PI / 2)));
  return out;
}

// Builds one pane as a slab: a height field over the pane with a quarter-round
// bevel at every edge (mitred at the corners), raised along the sheet normal.
function buildPane(name) {
  const [u0, u1, v0, v1] = MODEL.panes[name].rect;
  const at = (a, b) => sheet(u0 + (u1 - u0) * a, v0 + (v1 - v0) * b);

  // Physical pane size, for converting bevel radius into parameter space
  const c = at(0.5, 0.5), da = sub(at(0.51, 0.5), at(0.49, 0.5)), db = sub(at(0.5, 0.51), at(0.5, 0.49));
  const area = len(cross(da, db)) / (0.02 * 0.02);
  const widthPerp = area / (len(db) / 0.02), heightPerp = area / (len(da) / 0.02);
  const ra = Math.min(0.3, PARAMS.bevel / widthPerp), rb = Math.min(0.3, PARAMS.bevel / heightPerp);
  const as = paneSamples(ra), bs = paneSamples(rb);

  const pos = [];
  for (let j = 0; j < bs.length; j++) for (let i = 0; i < as.length; i++) {
    const a = as[i], b = bs[j];
    const base = at(a, b);
    const e = 1e-3;
    const n = norm(cross(sub(at(Math.min(1, a + e), b), at(Math.max(0, a - e), b)),
                         sub(at(a, Math.min(1, b + e)), at(a, Math.max(0, b - e)))));
    const toward = n[2] < 0 ? -1 : 1;
    // Distance to the nearest edge in reference px, then the bevel profile
    const dist = Math.min(a * widthPerp, (1 - a) * widthPerp, b * heightPerp, (1 - b) * heightPerp);
    const k = Math.min(1, dist / PARAMS.bevel);
    const h = PARAMS.thickness * Math.sqrt(Math.max(0, 1 - (1 - k) * (1 - k)));
    pos.push([base[0] + n[0] * h * toward, base[1] + n[1] * h * toward, base[2] + n[2] * h * toward, a, b]);
  }

  // Vertex normals from the final surface
  const W = as.length, Hh = bs.length;
  const P = (i, j) => pos[Math.max(0, Math.min(Hh - 1, j)) * W + Math.max(0, Math.min(W - 1, i))];
  const verts = [];
  const normals = [];
  for (let j = 0; j < Hh; j++) for (let i = 0; i < W; i++) {
    const px = sub(P(i + 1, j), P(i - 1, j)), py = sub(P(i, j + 1), P(i, j - 1));
    let n = norm(cross(px, py));
    if (n[2] < 0) n = [-n[0], -n[1], -n[2]];
    normals.push(n);
  }
  const push = (i, j) => { const p = pos[j * W + i], n = normals[j * W + i]; verts.push(p[0], p[1], p[2], n[0], n[1], n[2], p[3], p[4]); };
  for (let j = 0; j < Hh - 1; j++) for (let i = 0; i < W - 1; i++) {
    push(i, j); push(i + 1, j); push(i + 1, j + 1);
    push(i, j); push(i + 1, j + 1); push(i, j + 1);
  }
  // Normal of the flat face at the pane centre, used to keep face colours matching the reference
  let n0 = norm(cross(da, db)); if (n0[2] < 0) n0 = n0.map(v => -v);
  return { verts: new Float32Array(verts), n0 };
}

// ---------- Rendering ----------
const VERT = `#version 300 es
in vec3 a_pos; in vec3 a_normal; in vec2 a_uv;
uniform vec2 u_scale, u_offset;
out vec3 v_normal; out vec2 v_uv;
void main() {
  v_normal = a_normal; v_uv = a_uv;
  // Orthographic: reference pixels to clip space, z kept for depth testing
  gl_Position = vec4(a_pos.xy * u_scale + u_offset, -a_pos.z * 0.002, 1.0);
}`;

const FRAG = `#version 300 es
precision highp float;
uniform vec3 u_face[${(DEG + 1) * (DEG + 1)}];
uniform vec3 u_light, u_n0;
uniform float u_spec, u_shine;
in vec3 v_normal; in vec2 v_uv;
out vec4 outColor;

vec3 albedo(vec2 uv) {
  vec3 c = vec3(0.0); float ui = 1.0;
  for (int i = 0; i <= ${DEG}; i++) {
    float vj = 1.0;
    for (int j = 0; j <= ${DEG}; j++) { c += u_face[i * ${DEG + 1} + j] * ui * vj; vj *= uv.y; }
    ui *= uv.x;
  }
  return clamp(c, 0.0, 1.0);
}

float diffuse(vec3 n) {
  // Key light plus a soft fill from the opposite side and a little ambient
  vec3 fill = normalize(vec3(-u_light.x, -u_light.y, u_light.z));
  return 0.30 + 0.75 * max(dot(n, u_light), 0.0) + 0.15 * max(dot(n, fill), 0.0);
}

void main() {
  vec3 n = normalize(gl_FrontFacing ? v_normal : v_normal);
  vec3 view = vec3(0.0, 0.0, 1.0);
  // Lighting relative to the flat face, so faces keep the reference's colours
  // while bevels get lighter or darker according to where they face
  // The colour field was fitted away from the rims, so hold it at its edge values there
  vec3 c = albedo(clamp(v_uv, 0.11, 0.89)) * diffuse(n) / diffuse(normalize(u_n0));
  // Glossy highlight and a soft sky reflection toward grazing angles
  vec3 h = normalize(u_light + view);
  float spec = u_spec * pow(max(dot(n, h), 0.0), u_shine);
  float fres = pow(1.0 - max(dot(n, view), 0.0), 3.0);
  c += vec3(spec) + fres * 0.25 * vec3(0.85, 0.92, 1.0);
  outColor = vec4(clamp(c, 0.0, 1.0), 1.0);
}`;

function setupGL(canvas, size) {
  const dpr = window.devicePixelRatio || 1;
  canvas.width = canvas.height = size * dpr;
  canvas.style.width = canvas.style.height = size + 'px';
  const gl = canvas.getContext('webgl2', { antialias: true, premultipliedAlpha: false, alpha: true });
  const compile = (type, src) => { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw gl.getShaderInfoLog(s); return s; };
  const prog = gl.createProgram();
  gl.attachShader(prog, compile(gl.VERTEX_SHADER, VERT));
  gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, FRAG));
  gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw gl.getProgramInfoLog(prog);
  return { gl, prog, buf: gl.createBuffer() };
}

function drawPanes(ctx, panes) {
  const { gl, prog, buf } = ctx;
  gl.useProgram(prog);
  const uni = n => gl.getUniformLocation(prog, n);
  const k = 2 / REF.extent;
  gl.uniform2f(uni('u_scale'), k, -k);
  gl.uniform2f(uni('u_offset'), -REF.cx * k, REF.cy * k);
  const az = PARAMS.lightAz * Math.PI / 180, el = PARAMS.lightEl * Math.PI / 180;
  // Screen space: +x right, +y down, +z toward the viewer
  gl.uniform3fv(uni('u_light'), norm([Math.sin(az) * Math.cos(el), -Math.sin(el), Math.cos(az) * Math.cos(el)]));
  gl.uniform1f(uni('u_spec'), PARAMS.specular);
  gl.uniform1f(uni('u_shine'), PARAMS.shininess);

  gl.viewport(0, 0, gl.canvas.width, gl.canvas.height);
  gl.clearColor(0, 0, 0, 0);
  gl.clearDepth(1);
  gl.enable(gl.DEPTH_TEST);
  gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  const stride = 8 * 4;
  const attr = (name, size, offset) => { const l = gl.getAttribLocation(prog, name); gl.enableVertexAttribArray(l); gl.vertexAttribPointer(l, size, gl.FLOAT, false, stride, offset); };

  MODEL.order.forEach(name => {
    const pane = panes[name];
    gl.bufferData(gl.ARRAY_BUFFER, pane.verts, gl.DYNAMIC_DRAW);
    attr('a_pos', 3, 0); attr('a_normal', 3, 12); attr('a_uv', 2, 24);
    gl.uniform3fv(uni('u_face[0]'), MODEL.panes[name].face.flat());
    gl.uniform3fv(uni('u_n0'), pane.n0);
    gl.drawArrays(gl.TRIANGLES, 0, pane.verts.length / 8);
  });
}

// Soft drop shadow (light backgrounds) or glow (dark backgrounds) under the flag
function drawUnderlay(canvas, size, bg) {
  const dpr = window.devicePixelRatio || 1;
  canvas.width = canvas.height = size * dpr;
  canvas.style.width = canvas.style.height = size + 'px';
  const ctx = canvas.getContext('2d');
  const k = size / REF.extent;
  ctx.setTransform(k * dpr, 0, 0, k * dpr, (size / 2 - REF.cx * k) * dpr, (size / 2 - REF.cy * k) * dpr);
  const path = new Path2D();
  for (const name of MODEL.order) {
    const [u0, u1, v0, v1] = MODEL.panes[name].rect, n = 32, pts = [];
    const pt = (U, V) => { const p = sheet(U, V); return [p[0], p[1]]; };
    for (let i = 0; i <= n; i++) pts.push(pt(u0 + (u1 - u0) * i / n, v0));
    for (let i = 0; i <= n; i++) pts.push(pt(u1, v0 + (v1 - v0) * i / n));
    for (let i = n; i >= 0; i--) pts.push(pt(u0 + (u1 - u0) * i / n, v1));
    for (let i = n; i >= 0; i--) pts.push(pt(u0, v0 + (v1 - v0) * i / n));
    pts.forEach(([x, y], i) => i ? path.lineTo(x, y) : path.moveTo(x, y));
    path.closePath();
  }
  ctx.clearRect(-1000, -1000, 3000, 3000);
  if (bg === 'dark') {
    ctx.save(); ctx.filter = `blur(${7 * k * dpr}px)`; ctx.fillStyle = 'rgba(255,255,255,0.22)'; ctx.fill(path); ctx.restore();
    ctx.save(); ctx.translate(4.5, 4); ctx.filter = `blur(${2 * k * dpr}px)`; ctx.fillStyle = 'rgba(0,0,0,0.55)'; ctx.fill(path); ctx.restore();
  }
  else {
    ctx.save(); ctx.translate(4.5, 4); ctx.filter = `blur(${1.2 * k * dpr}px)`; ctx.fillStyle = 'rgba(0,0,0,0.12)'; ctx.fill(path); ctx.restore();
  }
}

// ---------- Page ----------
const views = [...document.querySelectorAll('.flag')].map(el => {
  const size = +el.dataset.size;
  el.style.width = el.style.height = size + 'px';
  const under = document.createElement('canvas'), over = document.createElement('canvas');
  el.append(under, over);
  return { el, size, under, gl: setupGL(over, size) };
});

function render() {
  const panes = {};
  for (const name of MODEL.order) panes[name] = buildPane(name);
  for (const v of views) {
    drawUnderlay(v.under, v.size, v.el.dataset.bg);
    drawPanes(v.gl, panes);
  }
}

const controls = document.getElementById('controls');
for (const [key, [min, max, step]] of Object.entries(RANGES)) {
  const label = document.createElement('span'); label.textContent = key;
  const input = Object.assign(document.createElement('input'), { type: 'range', min, max, step, value: PARAMS[key] });
  const value = document.createElement('span'); value.textContent = PARAMS[key];
  input.oninput = () => { PARAMS[key] = +input.value; value.textContent = input.value; render(); };
  controls.append(label, input, value);
}
render();
