<!doctype html>
<html><head><meta charset="utf-8"><title>Stream Launch</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
  -webkit-font-smoothing: antialiased;
  color: rgba(255,255,255,.9);
  background: radial-gradient(1200px 800px at 20% 0%, #3b3f6b 0%, #1d1f33 45%, #101118 100%);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 18px; padding: 70px 40px 40px;
}

/* ---------- Mockup controls ---------- */
.controls { position: fixed; top: 14px; left: 0; right: 0; display: flex; justify-content: center; gap: 10px; align-items: center; z-index: 50; }
.controls .title { font: 600 13px -apple-system; color: rgba(255,255,255,.55); margin-right: 8px; }
.seg { display: flex; background: rgba(0,0,0,.35); border-radius: 99px; padding: 3px; box-shadow: 0 0 0 .5px rgba(255,255,255,.15); }
.seg button { font: 500 12px -apple-system; color: rgba(255,255,255,.7); background: none; border: 0; padding: 5px 14px; border-radius: 99px; cursor: pointer; }
.seg button.on { background: rgba(255,255,255,.2); color: #fff; }

/* ---------- Window chrome + dimmed launcher (variant A) ---------- */
.window {
  width: 1180px; height: 740px; border-radius: 12px; overflow: hidden; position: relative;
  background: #121214;
  box-shadow: 0 0 0 .5px rgba(255,255,255,.18), 0 30px 80px rgba(0,0,0,.55);
  transition: all .7s cubic-bezier(.2,.8,.2,1);
}
.traffic { position: absolute; top: 18px; left: 20px; display: flex; gap: 8px; z-index: 5; }
.traffic i { width: 12px; height: 12px; border-radius: 50%; display: block; }
.traffic i:nth-child(1) { background: #ff5f57; } .traffic i:nth-child(2) { background: #febc2e; } .traffic i:nth-child(3) { background: #28c840; }
.launcher { position: absolute; inset: 0; filter: blur(14px) saturate(.9); transform: scale(1.04); opacity: .55; }
.hero { height: 380px; padding: 0 44px 34px; display: flex; flex-direction: column; justify-content: flex-end;
  background: linear-gradient(0deg, #121214 0%, rgba(18,18,20,.2) 45%, rgba(18,18,20,0) 100%),
              radial-gradient(900px 400px at 75% 20%, #00a2ed 0%, #0063b1 40%, #0b1f3a 80%); }
.hero h1 { font-size: 46px; font-weight: 800; letter-spacing: -.02em; }
.hero p { font-size: 14px; color: rgba(255,255,255,.65); margin-top: 6px; }
.shelf { padding: 24px 44px; display: flex; gap: 16px; }
.shelf div { width: 248px; height: 140px; border-radius: 12px; }
.a1 { background: linear-gradient(135deg, #0063b1, #7fd3ff); } .a2 { background: linear-gradient(160deg, #1a140c, #e8c66a); }
.a3 { background: linear-gradient(150deg, #3d1f5c, #f58529); } .a4 { background: linear-gradient(150deg, #101010, #f3e600); }
.scrim { position: absolute; inset: 0; background: rgba(0,0,0,.45); }
.window .card { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); }

/* ---------- Variant B: the window itself becomes the splash ---------- */
.desktop { display: none; width: 1180px; height: 740px; border-radius: 14px; position: relative; overflow: hidden;
  background: radial-gradient(900px 600px at 70% 30%, #4b6cb7 0%, #253a6e 50%, #121a33 100%); box-shadow: 0 30px 80px rgba(0,0,0,.45); }
.desktop .menubar { height: 26px; background: rgba(20,22,40,.45); backdrop-filter: blur(20px); font: 600 12px -apple-system; display: flex; align-items: center; gap: 18px; padding: 0 14px; color: rgba(255,255,255,.85); }
.desktop .card { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); }
body.variant-b .window { display: none; }
body.variant-b .desktop { display: block; }

/* ---------- The splash card ---------- */
.card {
  width: 340px; padding: 30px 30px 24px; border-radius: 20px;
  background: linear-gradient(180deg, rgba(40,40,46,.92), rgba(26,26,30,.94));
  backdrop-filter: blur(30px);
  box-shadow: 0 0 0 .5px rgba(255,255,255,.16), inset 0 1px 0 rgba(255,255,255,.07), 0 24px 60px rgba(0,0,0,.55);
  display: flex; flex-direction: column; align-items: center; text-align: center;
  animation: cardIn .5s cubic-bezier(.2,.9,.25,1.1) both;
}
@keyframes cardIn { from { opacity: 0; transform: translate(-50%, -46%) scale(.94); } to { opacity: 1; transform: translate(-50%, -50%) scale(1); } }

.flag-wrap { position: relative; width: 150px; height: 104px; margin-bottom: 14px; }
.flag-glow { position: absolute; left: 22px; top: 2px; width: 126px; height: 100px; border-radius: 50%;
  background: radial-gradient(closest-side, rgba(255,255,255,.13), rgba(120,170,255,.06) 60%, transparent); filter: blur(6px); }

.flag { position: absolute; inset: 0; width: 150px; height: 104px; }

.app { font-size: 19px; font-weight: 700; letter-spacing: -.01em; }
.host { font-size: 12px; color: rgba(255,255,255,.45); margin-top: 3px; display: flex; align-items: center; gap: 6px; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: #0a84ff; box-shadow: 0 0 6px #0a84ff88; }

/* XP boot style progress bar: three glossy blocks marching through a rounded trough */
.progress { margin-top: 20px; width: 150px; height: 14px; border-radius: 4px; position: relative; overflow: hidden;
  background: #0d0d10; box-shadow: inset 0 0 0 1px rgba(255,255,255,.18), inset 0 1px 3px rgba(0,0,0,.6); }
.progress .blocks { position: absolute; top: 3px; left: 0; display: flex; gap: 2px; animation: march 2.2s linear infinite; }
.progress .blocks i { width: 8px; height: 8px; border-radius: 1.5px;
  background: linear-gradient(180deg, #8fd0ff 0%, #2f7de1 45%, #1c4fbf 55%, #4a9bff 100%);
  box-shadow: 0 0 4px rgba(80,160,255,.6); }
@keyframes march { from { transform: translateX(-34px); } to { transform: translateX(160px); } }

.stage { font-size: 12.5px; color: rgba(255,255,255,.62); margin-top: 12px; height: 16px; transition: opacity .25s; }
.tip { margin-top: 22px; padding-top: 14px; border-top: 1px solid rgba(255,255,255,.07); width: 100%;
  font-size: 11px; color: rgba(255,255,255,.38); }
kbd { font: 500 10.5px -apple-system; color: rgba(255,255,255,.7); background: rgba(255,255,255,.09);
  border-radius: 4px; padding: 1px 5px; box-shadow: inset 0 -1px 0 rgba(255,255,255,.08); }

.note { max-width: 1180px; font-size: 12.5px; line-height: 1.5; color: rgba(255,255,255,.55); text-align: center; }
</style></head>
<body>

<div class="controls">
  <span class="title">Stream launch</span>
  <div class="seg" id="variant">
    <button class="on" data-v="a">A · Card over launcher</button>
    <button data-v="b">B · Window becomes the card</button>
  </div>
  <div class="seg" id="mode">
    <button class="on" data-m="start">Starting</button>
    <button data-m="resume">Resuming</button>
  </div>
</div>

<!-- Variant A: card floats over the dimmed, blurred launcher -->
<div class="window">
  <div class="traffic"><i></i><i></i><i></i></div>
  <div class="launcher">
    <div class="hero"><h1>Desktop</h1><p>Pick up where you left off · 3456×2160 · 120 FPS · HDR</p></div>
    <div class="shelf"><div class="a1"></div><div class="a2"></div><div class="a3"></div><div class="a4"></div></div>
  </div>
  <div class="scrim"></div>
  <div class="card" data-card></div>
</div>

<!-- Variant B: the main window hides and only the card is shown, floating on the desktop -->
<div class="desktop">
  <div class="menubar"><span></span><span>Moonlight</span><span style="font-weight:400">File</span><span style="font-weight:400">Edit</span><span style="font-weight:400">Window</span></div>
  <div class="card" data-card></div>
</div>

<p class="note" id="note"></p>

<template id="card-template">
  <div class="flag-wrap">
    <div class="flag-glow"></div>
    <canvas class="flag"></canvas>
  </div>
  <div class="app" data-app>Starting Desktop</div>
  <div class="host"><span class="dot"></span>on DESKTOP-BUO46UK</div>
  <div class="progress"><div class="blocks"><i></i><i></i><i></i></div></div>
  <div class="stage" data-stage>Starting platform initialization…</div>
  <div class="tip">Press <kbd>Ctrl</kbd> <kbd>⌥</kbd> <kbd>⇧</kbd> <kbd>Q</kbd> to disconnect your session</div>
</template>

<script>
// ---------- Waving flag ----------
// The flag is four curved panes riding one continuous travelling wave. Each
// pane is filled with a glossy vertical gradient, then shaded across its width
// by the wave's slope so the cloth catches the light as it ripples. A trail of
// small squares streams off the left edge, like the Windows XP logo.
const PANES = [
  // column, row, top colour, bottom colour
  [0, 0, '#ff7b45', '#e0300f'],
  [1, 0, '#a5df4c', '#45a01c'],
  [0, 1, '#4fbcff', '#0b62d0'],
  [1, 1, '#ffd84d', '#f3a000'],
];
const TRAIL = [
  // row (0 = top, 1 = bottom), distance from flag, size, colour
  [0.18, 9, 8, '#ea4a1e'], [0.22, 20, 6, '#ea4a1e'], [0.15, 29, 4.5, '#ea4a1e'], [0.24, 37, 3, '#ea4a1e'],
  [0.40, 12, 5, '#6cbf2c'], [0.37, 23, 3.5, '#6cbf2c'],
  [0.66, 9, 8, '#1f86ea'], [0.70, 20, 6, '#1f86ea'], [0.63, 29, 4.5, '#1f86ea'], [0.72, 37, 3, '#1f86ea'],
  [0.86, 13, 5, '#f7b51c'], [0.90, 24, 3.5, '#f7b51c'],
];

const FLAG = { x: 48, y: 14, w: 94, h: 76, gap: 3.5, amp: 5.5, wavelength: 85, speed: 3.4 };

function waveY(x, t) {
  // Amplitude grows toward the free (right) edge of the flag
  const reach = 0.45 + 0.55 * Math.max(0, (x - FLAG.x + 40) / (FLAG.w + 40));
  return FLAG.amp * reach * Math.sin((x / FLAG.wavelength) * Math.PI * 2 - t * FLAG.speed);
}

function waveSlope(x, t) {
  return waveY(x + 0.5, t) - waveY(x - 0.5, t);
}

// Maps a point on the flat flag to the screen: the wave offset plus a slight
// perspective that narrows the flag toward its far edge
function mapPoint(x, y, t) {
  const cy = FLAG.y + FLAG.h / 2;
  const persp = 1 - 0.1 * (x - FLAG.x) / FLAG.w;
  return [x, cy + (y - cy) * persp + waveY(x, t)];
}

function panePath(ctx, x0, y0, x1, y1, t) {
  const n = 20;
  ctx.beginPath();
  for (let i = 0; i <= n; i++) {
    const [px, py] = mapPoint(x0 + (x1 - x0) * i / n, y0, t);
    i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
  }
  for (let i = n; i >= 0; i--) {
    const [px, py] = mapPoint(x0 + (x1 - x0) * i / n, y1, t);
    ctx.lineTo(px, py);
  }
  ctx.closePath();
}

function drawFlag(canvas, t) {
  const dpr = window.devicePixelRatio || 1;
  const W = 150, H = 104;
  if (canvas.width !== W * dpr) { canvas.width = W * dpr; canvas.height = H * dpr; }
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, W, H);

  // Trail of squares, fading out as they get further from the flag
  for (const [row, dist, size, color] of TRAIL) {
    const [px, py] = mapPoint(FLAG.x - dist, FLAG.y + FLAG.h * row, t);
    ctx.globalAlpha = Math.max(0.15, 1 - dist / 44);
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.roundRect(px - size / 2, py - size / 2, size, size, size * 0.22);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  const pw = (FLAG.w - FLAG.gap) / 2, ph = (FLAG.h - FLAG.gap) / 2;

  // Drop shadow for the whole flag first, so panes don't shade each other
  ctx.save();
  ctx.shadowColor = 'rgba(0,0,0,0.4)';
  ctx.shadowBlur = 10;
  ctx.shadowOffsetY = 4;
  ctx.fillStyle = '#000';
  for (const [col, row] of PANES) {
    const x0 = FLAG.x + col * (pw + FLAG.gap), y0 = FLAG.y + row * (ph + FLAG.gap);
    panePath(ctx, x0, y0, x0 + pw, y0 + ph, t);
    ctx.fill();
  }
  ctx.restore();

  for (const [col, row, top, bottom] of PANES) {
    const x0 = FLAG.x + col * (pw + FLAG.gap), x1 = x0 + pw;
    const y0 = FLAG.y + row * (ph + FLAG.gap), y1 = y0 + ph;
    const [, topY] = mapPoint((x0 + x1) / 2, y0, t);
    const [, botY] = mapPoint((x0 + x1) / 2, y1, t);

    // Base fill
    const fill = ctx.createLinearGradient(0, topY - 4, 0, botY + 4);
    fill.addColorStop(0, top);
    fill.addColorStop(1, bottom);
    panePath(ctx, x0, y0, x1, y1, t);
    ctx.fillStyle = fill;
    ctx.fill();

    ctx.save();
    panePath(ctx, x0, y0, x1, y1, t);
    ctx.clip();

    // Light and shade across the pane from the wave's slope
    const shade = ctx.createLinearGradient(x0, 0, x1, 0);
    for (let i = 0; i <= 8; i++) {
      const s = waveSlope(x0 + (x1 - x0) * i / 8, t) * 2.2;
      shade.addColorStop(i / 8, s < 0 ? `rgba(255,255,255,${Math.min(0.32, -s * 0.5)})`
                                      : `rgba(0,0,0,${Math.min(0.3, s * 0.45)})`);
    }
    ctx.fillStyle = shade;
    ctx.fillRect(0, 0, W, H);

    // Glossy highlight on the upper part of each pane
    const gloss = ctx.createLinearGradient(0, topY, 0, topY + (botY - topY) * 0.45);
    gloss.addColorStop(0, 'rgba(255,255,255,0.26)');
    gloss.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = gloss;
    ctx.fillRect(0, 0, W, H);
    ctx.restore();

    // Thin bright rim to keep the edges crisp
    panePath(ctx, x0, y0, x1, y1, t);
    ctx.strokeStyle = 'rgba(255,255,255,0.18)';
    ctx.lineWidth = 0.8;
    ctx.lineJoin = 'round';
    ctx.stroke();
  }
}

const STAGES = ['platform initialization', 'name resolution', 'audio stream initialization', 'RTSP handshake',
                'control stream initialization', 'video stream initialization', 'input stream initialization',
                'control stream establishment', 'video stream establishment', 'audio stream establishment',
                'input stream establishment'];

const tpl = document.getElementById('card-template');
document.querySelectorAll('[data-card]').forEach(card => {
  card.appendChild(tpl.content.cloneNode(true));

  const canvas = card.querySelector('.flag');
  const start = performance.now();
  (function frame(now) {
    drawFlag(canvas, (now - start) / 1000);
    requestAnimationFrame(frame);
  })(start);
});

// Cycle through the real connection stages, like the stream would
let stage = 0, mode = 'start';
function render() {
  document.querySelectorAll('[data-app]').forEach(e => e.textContent = (mode === 'start' ? 'Starting' : 'Resuming') + ' Desktop');
  document.querySelectorAll('[data-stage]').forEach(e => {
    e.style.opacity = 0;
    setTimeout(() => { e.textContent = 'Starting ' + STAGES[stage] + '…'; e.style.opacity = 1; }, 200);
  });
}
setInterval(() => { stage = (stage + 1) % STAGES.length; render(); }, 1400);

const notes = {
  a: 'A — The launcher stays visible but blurs and dims behind a compact card. Implementable entirely in QML inside the existing window.',
  b: 'B — The main window hides when you launch, leaving only a small borderless rounded card floating on the desktop (like an app splash). Needs a separate frameless, translucent window.',
};
function setVariant(v) {
  document.body.classList.toggle('variant-b', v === 'b');
  document.querySelectorAll('#variant button').forEach(b => b.classList.toggle('on', b.dataset.v === v));
  document.getElementById('note').textContent = notes[v];
}
document.querySelectorAll('#variant button').forEach(b => b.onclick = () => setVariant(b.dataset.v));
document.querySelectorAll('#mode button').forEach(b => b.onclick = () => {
  mode = b.dataset.m;
  document.querySelectorAll('#mode button').forEach(x => x.classList.toggle('on', x === b));
  render();
});
setVariant(new URLSearchParams(location.search).get('v') || 'a');
render();
</script>
</body></html>
