<!doctype html>
<html><head><meta charset="utf-8"><title>Loading Screens</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
  -webkit-font-smoothing: antialiased;
  color: rgba(255,255,255,.9);
  background: radial-gradient(1200px 800px at 20% 0%, #3b3f6b 0%, #1d1f33 45%, #101118 100%);
}

/* ---------- Picker ---------- */
.controls { position: fixed; top: 14px; left: 0; right: 0; display: flex; justify-content: center; gap: 10px; align-items: center; z-index: 100; }
.seg { display: flex; background: rgba(0,0,0,.35); border-radius: 99px; padding: 3px; box-shadow: 0 0 0 .5px rgba(255,255,255,.15); }
.seg button, .replay { font: 500 12px -apple-system; color: rgba(255,255,255,.7); background: none; border: 0; padding: 5px 14px; border-radius: 99px; cursor: pointer; }
.seg button.on { background: rgba(255,255,255,.2); color: #fff; }
.replay { background: rgba(255,255,255,.12); color: #fff; box-shadow: 0 0 0 .5px rgba(255,255,255,.15); }
.note { position: fixed; bottom: 14px; left: 0; right: 0; text-align: center; font-size: 12.5px; color: rgba(255,255,255,.55); padding: 0 40px; }

/* The window is laid out at 1180x740 and scaled to fit the viewport */
.stage { position: absolute; left: 50%; top: 58px; width: 1180px; height: 740px; transform-origin: top center; }

/* ---------- Window ---------- */
.window {
  position: absolute; inset: 0; border-radius: 12px; overflow: hidden;
  background: #0b0b0d;
  box-shadow: 0 0 0 .5px rgba(255,255,255,.18), 0 30px 80px rgba(0,0,0,.55);
}
.traffic { position: absolute; top: 18px; left: 20px; display: flex; gap: 8px; z-index: 60; transition: opacity .4s; }
.traffic i { width: 12px; height: 12px; border-radius: 50%; display: block; }
.traffic i:nth-child(1) { background: #ff5f57; } .traffic i:nth-child(2) { background: #febc2e; } .traffic i:nth-child(3) { background: #28c840; }

.ease { transition-timing-function: cubic-bezier(.2,.9,.1,1); }

/* ---------- Launcher (the main screen) ---------- */
.launcher { position: absolute; inset: 0; background: #121214; transform-origin: center;
  transition: transform .8s cubic-bezier(.2,.9,.1,1), filter .8s ease, opacity .6s ease, border-radius .8s; }
.hero { height: 400px; position: relative; padding: 0 44px 34px; display: flex; flex-direction: column; justify-content: flex-end;
  background: linear-gradient(0deg, #121214 0%, rgba(18,18,20,.2) 45%, rgba(18,18,20,0) 100%),
              radial-gradient(900px 400px at 75% 20%, #00a2ed 0%, #0063b1 40%, #0b1f3a 80%); }
.topbar { position: absolute; top: 0; left: 0; right: 0; height: 52px; display: flex; align-items: center; justify-content: center; }
.pill { display: flex; background: rgba(0,0,0,.3); border-radius: 99px; padding: 3px; box-shadow: 0 0 0 .5px rgba(255,255,255,.15); }
.pill span { font-size: 12px; font-weight: 500; padding: 4px 14px; border-radius: 99px; color: rgba(255,255,255,.7); display: flex; gap: 6px; align-items: center; }
.pill span.on { background: rgba(255,255,255,.2); color: #fff; }
.dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; flex: none; }
.dot.on { background: #32d74b; box-shadow: 0 0 6px #32d74b88; }
.dot.busy { background: #0a84ff; box-shadow: 0 0 6px #0a84ff88; }
.eyebrow { font-size: 12px; font-weight: 600; color: rgba(255,255,255,.7); display: flex; gap: 7px; align-items: center; letter-spacing: .04em; }
.hero h1 { font-size: 46px; font-weight: 800; letter-spacing: -.02em; margin: 6px 0 4px; }
.hero p { font-size: 14px; color: rgba(255,255,255,.65); margin-bottom: 18px; }
.actions { display: flex; gap: 10px; }
.big { font: 600 14px -apple-system; padding: 9px 22px; border-radius: 99px; border: 0; color: #000; background: #fff; transition: transform .15s; }
.big.ghost { background: rgba(255,255,255,.16); color: #fff; }
.big.pressed { transform: scale(.94); }
.shelf { padding: 6px 44px 0; }
.shelf h2 { font-size: 17px; font-weight: 700; margin: 12px 0 12px; display: flex; align-items: baseline; gap: 10px; }
.shelf h2 small { font-size: 12px; font-weight: 500; color: rgba(255,255,255,.4); }
.row { display: flex; gap: 16px; }
.tile { width: 248px; flex: none; }
.tile .art { height: 140px; border-radius: 12px; display: flex; align-items: center; justify-content: center;
  box-shadow: 0 0 0 .5px rgba(255,255,255,.1), 0 10px 24px rgba(0,0,0,.4); transition: transform .15s; }
.tile.focus .art { box-shadow: 0 0 0 3px rgba(255,255,255,.9), 0 18px 40px rgba(0,0,0,.6); }
.tile.pressed .art { transform: scale(.95); }
.tile .name { font-size: 13px; font-weight: 600; margin-top: 9px; }
.tile .sub { font-size: 11px; color: rgba(255,255,255,.45); }
.art-desktop { background: linear-gradient(135deg, #0063b1 0%, #00a2ed 60%, #7fd3ff 100%); }
.art-steam { background: linear-gradient(160deg, #1b2838 0%, #2a475e 55%, #66c0f4 130%); }
.art-elden { background: linear-gradient(160deg, #1a140c 0%, #6b5326 60%, #e8c66a 130%); }
.art-forza { background: linear-gradient(150deg, #0b2a4a 0%, #e0443a 120%); }

/* ---------- Windows glyph (four panes) ---------- */
.glyph { display: grid; grid-template-columns: 1fr 1fr; gap: var(--gap, 5px); width: var(--size, 64px); height: var(--size, 64px); }
.glyph i { display: block; border-radius: var(--r, 3px); background: var(--fill, #fff); }
.art .glyph { --size: 46px; --gap: 4px; --fill: rgba(255,255,255,.92); filter: drop-shadow(0 2px 10px rgba(0,0,0,.3)); }

/* ---------- Remote desktop (stylised Windows 11) ---------- */
.remote { position: absolute; inset: 0; overflow: hidden; background: #0a1a3c; }
.wall { position: absolute; inset: 0;
  background:
    radial-gradient(420px 300px at 50% 52%, rgba(120,190,255,.95), rgba(40,110,230,.0) 70%),
    radial-gradient(700px 520px at 46% 58%, rgba(35,110,235,.85), rgba(10,40,120,0) 70%),
    radial-gradient(900px 700px at 60% 40%, rgba(70,60,200,.5), rgba(0,0,0,0) 70%),
    linear-gradient(160deg, #0b1d4a 0%, #0a2a6e 50%, #06143a 100%); }
.bloom { position: absolute; left: 50%; top: 52%; width: 520px; height: 340px; transform: translate(-50%, -50%); }
.bloom i { position: absolute; left: 50%; top: 50%; width: 300px; height: 200px; border-radius: 60% 40% 55% 45%;
  background: linear-gradient(135deg, rgba(160,215,255,.9), rgba(30,110,240,.6)); filter: blur(1px); mix-blend-mode: screen; opacity: .55; }
.bloom i:nth-child(1) { transform: translate(-50%, -50%) rotate(-28deg) translateX(-60px); }
.bloom i:nth-child(2) { transform: translate(-50%, -50%) rotate(12deg); }
.bloom i:nth-child(3) { transform: translate(-50%, -50%) rotate(48deg) translateX(60px); }
.icons { position: absolute; left: 22px; top: 50px; display: flex; flex-direction: column; gap: 22px; }
.icons div { width: 64px; display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 11px; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.6); }
.icons div i { width: 36px; height: 36px; border-radius: 8px; display: block; box-shadow: 0 2px 6px rgba(0,0,0,.3); }
.taskbar { position: absolute; left: 0; right: 0; bottom: 0; height: 48px; background: rgba(28,32,48,.72); backdrop-filter: blur(30px);
  border-top: 1px solid rgba(255,255,255,.08); display: flex; align-items: center; justify-content: center; gap: 6px; }
.taskbar > i { width: 36px; height: 36px; border-radius: 6px; display: flex; align-items: center; justify-content: center; }
.taskbar > i.on { background: rgba(255,255,255,.08); }
.taskbar > i b { width: 22px; height: 22px; border-radius: 5px; display: block; }
.taskbar .start .glyph { --size: 20px; --gap: 2px; --r: 1.5px; --fill: linear-gradient(135deg, #4cc2ff, #0078d4); }
.taskbar .search { width: 150px; height: 30px; border-radius: 15px; background: rgba(255,255,255,.08); margin: 0 6px; font-size: 11px; color: rgba(255,255,255,.6); display: flex; align-items: center; padding-left: 12px; }
.clock { position: absolute; right: 14px; bottom: 7px; font-size: 11px; text-align: right; line-height: 1.35; color: #fff; }

/* ---------- A · Tile Zoom ---------- */
.a-zoom { position: absolute; border-radius: 12px; overflow: hidden; z-index: 20;
  transition: left .7s cubic-bezier(.2,.9,.1,1), top .7s cubic-bezier(.2,.9,.1,1), width .7s cubic-bezier(.2,.9,.1,1), height .7s cubic-bezier(.2,.9,.1,1), border-radius .7s, opacity .6s; }
.a-zoom .bg { position: absolute; inset: -60px; transition: filter .9s ease; }
.a-zoom.open .bg { filter: blur(50px) saturate(1.4) brightness(.55); }
.a-zoom .tile-glyph { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); transition: opacity .25s; }
.a-center { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -54%); z-index: 30; display: flex; flex-direction: column; align-items: center;
  transition: opacity .5s, transform .6s cubic-bezier(.2,.9,.1,1); }
.a-center .glyph { --size: 72px; --gap: 6px; --r: 4px; }
.a-center .glyph i { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(.3); transition: opacity .45s, transform .7s cubic-bezier(.34,1.56,.64,1); }
.a-center.in .glyph i { opacity: 1; transform: none; }
.a-center .glyph i:nth-child(1) { --dx: -26px; --dy: -26px; } .a-center .glyph i:nth-child(2) { --dx: 26px; --dy: -26px; transition-delay: .06s; }
.a-center .glyph i:nth-child(3) { --dx: -26px; --dy: 26px; transition-delay: .12s; } .a-center .glyph i:nth-child(4) { --dx: 26px; --dy: 26px; transition-delay: .18s; }
.a-center .title { font-size: 22px; font-weight: 700; letter-spacing: -.01em; margin-top: 26px; }
.a-center .sub { font-size: 12.5px; color: rgba(255,255,255,.55); margin-top: 4px; display: flex; align-items: center; gap: 6px; }
.a-center .bar { margin-top: 22px; width: 180px; height: 3px; border-radius: 2px; background: rgba(255,255,255,.15); overflow: hidden; }
.a-center .bar i { display: block; height: 100%; width: 0; border-radius: 2px; background: #fff; transition: width .9s cubic-bezier(.2,.9,.1,1); box-shadow: 0 0 8px rgba(255,255,255,.6); }
.a-center > * { opacity: 0; transition: opacity .5s .25s; }
.a-center.in > * { opacity: 1; }
.a-center.out { opacity: 0; transform: translate(-50%, -54%) scale(1.12); }
.stage-text { font-size: 12px; color: rgba(255,255,255,.55); margin-top: 12px; height: 16px; transition: opacity .2s; }

/* Remote desktop resolving out of the blur */
.remote.reveal { opacity: 0; transform: scale(1.06); filter: blur(18px) brightness(.7); transition: opacity .8s ease, transform 1s cubic-bezier(.2,.9,.1,1), filter .9s ease; }
.remote.reveal.shown { opacity: 1; transform: none; filter: none; }

/* ---------- B · Window Panes ---------- */
.b-pane { position: absolute; overflow: hidden; z-index: 25; border-radius: 9px;
  transition: left .85s cubic-bezier(.75,0,.2,1), top .85s cubic-bezier(.75,0,.2,1), width .85s cubic-bezier(.75,0,.2,1), height .85s cubic-bezier(.75,0,.2,1), border-radius .85s, transform .5s cubic-bezier(.34,1.56,.64,1), opacity .3s; }
.b-pane .view { position: absolute; width: 1180px; height: 740px;
  transition: left .85s cubic-bezier(.75,0,.2,1), top .85s cubic-bezier(.75,0,.2,1); }
.b-pane .frost { position: absolute; inset: 0; background: rgba(255,255,255,.92); box-shadow: inset 0 0 0 .5px rgba(255,255,255,.6); transition: opacity .35s; }
.b-panes.loading .b-pane .frost { animation: sweep 1.6s ease-in-out infinite; }
.b-pane:nth-child(1) .frost { animation-delay: 0s !important; } .b-pane:nth-child(2) .frost { animation-delay: .4s !important; }
.b-pane:nth-child(4) .frost { animation-delay: .8s !important; } .b-pane:nth-child(3) .frost { animation-delay: 1.2s !important; }
@keyframes sweep { 0%, 100% { opacity: .35; } 20% { opacity: 1; } 45% { opacity: .35; } }
.b-panes.clear .b-pane .frost { opacity: 0; animation: none; }
.b-text { position: absolute; left: 0; right: 0; top: 432px; text-align: center; z-index: 30; transition: opacity .4s, transform .5s; }
.b-text .title { font-size: 17px; font-weight: 600; }
.b-text.hidden { opacity: 0; transform: translateY(8px); }

/* ---------- C · Spaces ---------- */
.c-hud { position: absolute; left: 50%; top: 14px; z-index: 50; transform: translateX(-50%);
  width: 120px; height: 30px; border-radius: 15px; background: #000; opacity: 0;
  box-shadow: 0 0 0 .5px rgba(255,255,255,.14), 0 14px 40px rgba(0,0,0,.5);
  display: flex; align-items: center; gap: 14px; padding: 0 16px; overflow: hidden;
  transition: width .6s cubic-bezier(.34,1.3,.64,1), height .6s cubic-bezier(.34,1.3,.64,1), border-radius .6s, opacity .3s, top .6s cubic-bezier(.34,1.3,.64,1); }
.c-hud.open { width: 400px; height: 68px; border-radius: 34px; opacity: 1; }
.c-hud.done { width: 300px; height: 38px; border-radius: 19px; }
.c-hud.gone { top: -60px; opacity: 0; }
.c-hud > * { transition: opacity .25s; }
.c-hud .glyph { --size: 30px; --gap: 3px; --r: 2.5px; flex: none; }
.c-hud .glyph i { background: rgba(255,255,255,.18); transition: background .25s, box-shadow .25s; }
.c-hud .glyph i.lit { background: #0a84ff; box-shadow: 0 0 10px #0a84ffaa; }
.c-hud .text { flex: 1; min-width: 0; }
.c-hud .text b { display: block; font-size: 14px; font-weight: 600; }
.c-hud .text span { display: block; font-size: 11.5px; color: rgba(255,255,255,.55); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transition: opacity .2s; }
.c-hud svg { flex: none; }
.c-hud .ring { transition: stroke-dashoffset .8s cubic-bezier(.2,.9,.1,1); }
.c-hud .connected { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 12.5px; font-weight: 500; opacity: 0; }
.c-hud.done > :not(.connected) { opacity: 0; }
.c-hud.done .connected { opacity: 1; transition-delay: .2s; }
.window.c-mode { background: radial-gradient(900px 600px at 50% 40%, #23253a, #0b0b0d); }
.launcher.recede-c { transform: scale(.86) translateY(14px); border-radius: 14px; filter: brightness(.6); box-shadow: 0 30px 80px rgba(0,0,0,.6); }
.launcher.exit-c { transform: translateX(-108%) scale(.86) translateY(14px); filter: brightness(.4); }
.remote.space { border-radius: 14px; transform: translateX(108%) scale(.86) translateY(14px);
  transition: transform .75s cubic-bezier(.2,.9,.1,1), border-radius .5s; box-shadow: 0 30px 80px rgba(0,0,0,.6); }
.remote.space.arrive { transform: translateX(0) scale(.86) translateY(14px); }
.remote.space.fill { transform: none; border-radius: 0; transition: transform .6s cubic-bezier(.2,.9,.1,1), border-radius .6s; }

/* ---------- Remote: an open app window (Windows 11 style) ---------- */
.appwin { position: absolute; left: 250px; top: 96px; width: 660px; height: 420px; border-radius: 9px; overflow: hidden;
  background: rgba(30,32,38,.94); box-shadow: 0 0 0 1px rgba(255,255,255,.09), 0 24px 60px rgba(0,0,0,.5); display: flex; flex-direction: column; }
.appwin .bar { height: 38px; display: flex; align-items: center; padding-left: 14px; gap: 10px; font-size: 12px; color: #fff; background: rgba(255,255,255,.03); }
.appwin .bar .folder { width: 16px; height: 13px; border-radius: 2px; background: linear-gradient(160deg,#ffd76a,#e8a10c); }
.appwin .bar .caps { margin-left: auto; display: flex; height: 100%; }
.appwin .bar .caps span { width: 46px; display: flex; align-items: center; justify-content: center; color: rgba(255,255,255,.7); font-size: 12px; }
.appwin .tools { height: 40px; display: flex; align-items: center; gap: 8px; padding: 0 14px; border-bottom: 1px solid rgba(255,255,255,.06); }
.appwin .tools i { width: 26px; height: 22px; border-radius: 4px; background: rgba(255,255,255,.07); display: block; }
.appwin .tools .path { flex: 1; height: 26px; border-radius: 5px; background: rgba(255,255,255,.06); font-size: 11.5px; color: rgba(255,255,255,.75); display: flex; align-items: center; padding-left: 10px; }
.appwin .body { flex: 1; display: flex; }
.appwin .side { width: 160px; padding: 10px 8px; display: flex; flex-direction: column; gap: 3px; border-right: 1px solid rgba(255,255,255,.06); }
.appwin .side span { font-size: 11.5px; color: rgba(255,255,255,.75); padding: 5px 8px; border-radius: 5px; display: flex; gap: 8px; align-items: center; }
.appwin .side span.on { background: rgba(255,255,255,.08); color: #fff; }
.appwin .side span i { width: 13px; height: 11px; border-radius: 2px; display: block; background: linear-gradient(160deg,#4cc2ff,#0067c0); }
.appwin .grid { flex: 1; padding: 16px; display: grid; grid-template-columns: repeat(5, 1fr); gap: 14px 10px; align-content: start; }
.appwin .grid div { display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 11px; color: rgba(255,255,255,.85); }
.appwin .grid div i { width: 52px; height: 40px; border-radius: 4px; display: block; background: linear-gradient(160deg,#ffd76a,#e8a10c); box-shadow: inset 0 6px 0 rgba(255,255,255,.18); }
.appwin .grid div.sel i { outline: 2px solid rgba(96,180,255,.8); outline-offset: 3px; }

/* ---------- D · Spaces + Snapshot ---------- */
.d-space { position: absolute; inset: 0; z-index: 10; overflow: hidden; border-radius: 0; opacity: 0;
  transition: transform .75s cubic-bezier(.2,.9,.1,1), border-radius .75s, opacity .45s ease .08s, box-shadow .75s; }
.launcher.lift-d { transform: scale(.86) translateY(-18px); border-radius: 14px; box-shadow: 0 30px 80px rgba(0,0,0,.6); }
.d-space.lift { transform: scale(.86) translateY(-18px); border-radius: 14px; opacity: 1; box-shadow: 0 30px 80px rgba(0,0,0,.6); }
.d-space.fill { transform: none; border-radius: 0; box-shadow: none;
  transition: transform .8s cubic-bezier(.2,.9,.1,1), border-radius .8s, box-shadow .8s; }
/* The saved last frame, shown blurred and dimmed until the live stream takes over */
.d-snap { position: absolute; inset: 0; z-index: 2; }
.d-snap .shot { position: absolute; inset: -30px; padding: 30px; filter: blur(7px) saturate(.85) brightness(.68);
  transition: filter .8s cubic-bezier(.2,.9,.1,1); }
.d-snap.live .shot { filter: none; }
.d-snap.gone { opacity: 0; transition: opacity .45s ease; }
.d-tag { position: absolute; left: 50%; bottom: 74px; transform: translateX(-50%); z-index: 3;
  display: flex; align-items: center; gap: 8px; padding: 7px 14px; border-radius: 99px;
  background: rgba(0,0,0,.45); backdrop-filter: blur(20px); box-shadow: 0 0 0 .5px rgba(255,255,255,.14);
  font-size: 12px; color: rgba(255,255,255,.8); opacity: 0; transition: opacity .4s, transform .4s; }
.d-tag.in { opacity: 1; }
.d-tag.out { opacity: 0; transform: translateX(-50%) translateY(6px); }
.d-tag svg { opacity: .8; }
</style></head>
<body>

<div class="controls">
  <div class="seg" id="picker">
    <button data-v="a" class="on">A · Tile Zoom</button>
    <button data-v="b">B · Window Panes</button>
    <button data-v="c">C · Spaces</button>
    <button data-v="d">D · Snapshot</button>
  </div>
  <button class="replay" id="replay">↻ Replay</button>
</div>

<div class="stage" id="stage"><div class="window" id="window"></div></div>
<p class="note" id="note"></p>

<script>
const NOTES = {
  a: 'A · Tile Zoom — the tile you clicked grows into the window and its art blurs into the backdrop. The Windows glyph assembles with status and progress, then the remote desktop resolves out of the blur.',
  b: 'B · Window Panes — the launcher recedes behind four frosted panes that pulse while connecting. On connect they clear into windows onto the remote desktop, then grow until the gaps close.',
  d: 'D · Snapshot — the window lifts into a card and the launcher fades straight into a blurred snapshot of where you left off, while the capsule shows progress. When the first live frame arrives, the card un-blurs and drops back down to fill the window, dissolving into the live stream, which only differs by what changed since (here, the clock).',
  c: 'C · Spaces — the launcher steps back like Stage Manager and a capsule drops from the top with a four-pane spinner and progress ring. The remote desktop slides in like switching Spaces, and the capsule shrinks to "Connected".',
};
const STAGES = ['Resolving DESKTOP-BUO46UK…', 'Starting RTSP handshake…', 'Initializing video stream…', 'Initializing input…', 'Starting stream…'];

const LAUNCHER = `
<div class="launcher" id="launcher">
  <div class="hero">
    <div class="topbar"><div class="pill"><span class="on"><span class="dot on"></span>DESKTOP-BUO46UK</span><span><span class="dot on"></span>Living Room PC</span><span>＋</span></div></div>
    <div class="eyebrow"><span class="dot on"></span>READY ON DESKTOP-BUO46UK</div>
    <h1>Desktop</h1>
    <p>3456×2160 · 120 FPS · HDR</p>
    <div class="actions"><button class="big" id="play">▶ Start</button><button class="big ghost">Quit App</button></div>
  </div>
  <div class="shelf">
    <h2>Apps <small>4 on this computer</small></h2>
    <div class="row">
      <div class="tile focus" id="tile"><div class="art art-desktop"><div class="glyph"><i></i><i></i><i></i><i></i></div></div><div class="name">Desktop</div><div class="sub">Last played yesterday</div></div>
      <div class="tile"><div class="art art-steam"></div><div class="name">Steam</div><div class="sub">2 days ago</div></div>
      <div class="tile"><div class="art art-elden"></div><div class="name">Elden Ring</div><div class="sub">Last week</div></div>
      <div class="tile"><div class="art art-forza"></div><div class="name">Forza Horizon 5</div><div class="sub">Never played</div></div>
    </div>
  </div>
</div>`;

const REMOTE = (id = '', cls = '', opts = {}) => `
<div class="remote ${cls}" ${id ? `id="${id}"` : ''}>
  <div class="wall"></div>
  <div class="bloom"><i></i><i></i><i></i></div>
  <div class="icons">
    <div><i style="background:linear-gradient(160deg,#e9eef5,#9fb3c8)"></i>Recycle Bin</div>
    <div><i style="background:linear-gradient(160deg,#66c0f4,#1b2838)"></i>Steam</div>
    <div><i style="background:linear-gradient(160deg,#ffd76a,#e8a10c)"></i>Projects</div>
  </div>
  <div class="taskbar">
    <i class="start"><span class="glyph"><i></i><i></i><i></i><i></i></span></i>
    <span class="search">Search</span>
    <i class="on"><b style="background:linear-gradient(135deg,#ffd76a,#f0a30a)"></b></i>
    <i><b style="background:linear-gradient(135deg,#4cc2ff,#0067c0)"></b></i>
    <i class="on"><b style="background:linear-gradient(135deg,#66c0f4,#1b2838)"></b></i>
    <i><b style="background:linear-gradient(135deg,#8fe388,#1f8a3a)"></b></i>
  </div>
  ${opts.window ? APPWIN : ''}
  <div class="clock">${opts.clock || '10:42 AM<br>10/4/2026'}</div>
</div>`;

// An open File Explorer window, which is where the last session left off
const APPWIN = `
<div class="appwin">
  <div class="bar"><span class="folder"></span>Projects<span class="caps"><span>—</span><span>☐</span><span>✕</span></span></div>
  <div class="tools"><i></i><i></i><i></i><span class="path">This PC › Documents › Projects</span><i></i></div>
  <div class="body">
    <div class="side"><span><i></i>Home</span><span><i></i>Desktop</span><span><i></i>Downloads</span><span class="on"><i></i>Documents</span><span><i></i>Pictures</span><span><i></i>Music</span><span><i></i>This PC</span></div>
    <div class="grid">
      <div><i></i>moonlight-qt</div><div class="sel"><i></i>sunshine</div><div><i></i>website</div><div><i></i>assets</div><div><i></i>builds</div>
      <div><i></i>notes</div><div><i></i>shaders</div><div><i></i>scripts</div><div><i></i>archive</div><div><i></i>tmp</div>
    </div>
  </div>
</div>`;

const W = 1180, H = 740;
const win = document.getElementById('window');
let timers = [], intervals = [];
const at = (ms, fn) => timers.push(setTimeout(fn, ms));
const every = (ms, fn) => intervals.push(setInterval(fn, ms));
const $ = sel => win.querySelector(sel);
const reflow = el => el.getBoundingClientRect();

function cycleStages(el, step = 700) {
  let i = 0;
  el.textContent = STAGES[0];
  every(step, () => {
    if (i >= STAGES.length - 1) return;
    i++;
    el.style.opacity = 0;
    setTimeout(() => { el.textContent = STAGES[i]; el.style.opacity = 1; }, 180);
  });
}

// Position of an element in window coordinates, unaffected by the stage's scaling
function rectIn(el) {
  const r = el.getBoundingClientRect(), w = win.getBoundingClientRect(), s = w.width / W;
  return { x: (r.left - w.left) / s, y: (r.top - w.top) / s, w: r.width / s, h: r.height / s };
}

// ---------- A · Tile Zoom ----------
function playA() {
  win.innerHTML = LAUNCHER + REMOTE('remote', 'reveal') + `
    <div class="a-center" id="center">
      <div class="glyph"><i></i><i></i><i></i><i></i></div>
      <div class="title">Starting Desktop</div>
      <div class="sub"><span class="dot busy"></span>DESKTOP-BUO46UK</div>
      <div class="bar"><i id="bar"></i></div>
      <div class="stage-text" id="stageText"></div>
    </div>`;
  const tile = $('#tile'), center = $('#center'), bar = $('#bar');
  at(500, () => tile.classList.add('pressed'));
  at(680, () => {
    tile.classList.remove('pressed');
    // A copy of the tile's art grows from the tile to fill the window
    const r = rectIn(tile.querySelector('.art'));
    const zoom = document.createElement('div');
    zoom.className = 'a-zoom';
    Object.assign(zoom.style, { left: r.x + 'px', top: r.y + 'px', width: r.w + 'px', height: r.h + 'px' });
    zoom.innerHTML = `<div class="bg art-desktop"></div><div class="tile-glyph"><div class="glyph" style="--size:46px;--gap:4px;--fill:rgba(255,255,255,.92)"><i></i><i></i><i></i><i></i></div></div>`;
    win.appendChild(zoom);
    reflow(zoom);
    Object.assign(zoom.style, { left: '0px', top: '0px', width: W + 'px', height: H + 'px', borderRadius: '0px' });
    zoom.classList.add('open');
    zoom.querySelector('.tile-glyph').style.opacity = 0;
    $('#launcher').style.transform = 'scale(.96)';
    at(350, () => { center.classList.add('in'); cycleStages($('#stageText')); });
    [0.25, 0.5, 0.72, 0.9, 1].forEach((p, i) => at(500 + i * 700, () => bar.style.width = (p * 100) + '%'));
    at(4300, () => {
      // Connected: the glyph lifts away and the desktop resolves out of the blur
      center.classList.add('out');
      $('#remote').classList.add('shown');
      zoom.style.opacity = 0;
    });
  });
}

// ---------- B · Window Panes ----------
function playB() {
  win.innerHTML = LAUNCHER + `<div class="b-panes loading" id="panes"></div>
    <div class="b-text hidden" id="btext"><div class="title">Connecting to Desktop</div><div class="stage-text" id="stageText"></div></div>`;
  const panes = $('#panes');
  const S = 34, G = 7, cx = W / 2, cy = 370;
  const small = (c, r) => ({ x: cx - S - G / 2 + c * (S + G), y: cy - S - G / 2 + r * (S + G), w: S, h: S });
  const full = (c, r) => ({ x: c * W / 2, y: r * H / 2, w: W / 2, h: H / 2 });
  const cells = [[0, 0], [1, 0], [0, 1], [1, 1]];
  // Each pane is a window onto the same full-size remote desktop, offset so all four line up
  const els = cells.map(([c, r], i) => {
    const el = document.createElement('div');
    el.className = 'b-pane';
    el.innerHTML = `<div class="view">${REMOTE()}</div><div class="frost"></div>`;
    panes.appendChild(el);
    const place = rc => {
      Object.assign(el.style, { left: rc.x + 'px', top: rc.y + 'px', width: rc.w + 'px', height: rc.h + 'px' });
      Object.assign(el.querySelector('.view').style, { left: -rc.x + 'px', top: -rc.y + 'px' });
    };
    place(small(c, r));
    el.style.transform = 'scale(0)';
    el.style.transitionDelay = `${i * 0.06}s`;
    return { el, place, c, r };
  });

  at(500, () => $('#play').classList.add('pressed'));
  at(650, () => {
    $('#play').classList.remove('pressed');
    const l = $('#launcher');
    l.style.transform = 'scale(.94)'; l.style.filter = 'blur(14px) brightness(.45)';
    els.forEach(p => p.el.style.transform = 'none');
    at(300, () => { $('#btext').classList.remove('hidden'); cycleStages($('#stageText')); });
  });
  at(4000, () => {
    // Connected: the frost clears, so the panes become windows onto the desktop
    panes.classList.remove('loading'); panes.classList.add('clear');
    $('#btext').classList.add('hidden');
  });
  at(4450, () => {
    els.forEach(p => { p.el.style.transitionDelay = '0s'; p.el.style.borderRadius = '0px'; p.place(full(p.c, p.r)); });
  });
}

// ---------- C · Spaces ----------
function playC() {
  win.classList.add('c-mode');
  win.innerHTML = LAUNCHER + REMOTE('remote', 'space') + `
    <div class="c-hud" id="hud">
      <div class="glyph" id="spinner"><i></i><i></i><i></i><i></i></div>
      <div class="text"><b>Starting Desktop</b><span id="stageText"></span></div>
      <svg width="30" height="30" viewBox="0 0 30 30"><circle cx="15" cy="15" r="12" fill="none" stroke="rgba(255,255,255,.15)" stroke-width="3"/>
        <circle class="ring" id="ring" cx="15" cy="15" r="12" fill="none" stroke="#0a84ff" stroke-width="3" stroke-linecap="round"
          stroke-dasharray="75.4" stroke-dashoffset="75.4" transform="rotate(-90 15 15)"/></svg>
      <div class="connected"><span class="dot on"></span>Connected · 3456×2160 · 120 FPS</div>
    </div>`;
  const hud = $('#hud'), l = $('#launcher'), remote = $('#remote');
  at(500, () => $('#play').classList.add('pressed'));
  at(650, () => {
    $('#play').classList.remove('pressed');
    l.classList.add('recede-c');
    hud.classList.add('open');
    cycleStages($('#stageText'));
    // Spinner: panes light up clockwise in turn
    const order = [0, 1, 3, 2]; let k = 0;
    const panes = [...$('#spinner').children];
    every(220, () => { panes.forEach(p => p.classList.remove('lit')); panes[order[k % 4]].classList.add('lit'); panes[order[(k + 3) % 4]].classList.add('lit'); k++; });
    [0.2, 0.45, 0.68, 0.86, 1].forEach((p, i) => at(250 + i * 700, () => $('#ring').style.strokeDashoffset = 75.4 * (1 - p)));
  });
  at(4200, () => {
    // Connected: switch "spaces" to the remote desktop, then let it fill the window
    intervals.forEach(clearInterval); intervals = [];
    hud.classList.add('done');
    l.classList.add('exit-c');
    remote.classList.add('arrive');
    at(700, () => remote.classList.add('fill'));
    at(2400, () => hud.classList.add('gone'));
  });
}

// ---------- D · Spaces + Snapshot ----------
function playD() {
  win.classList.add('c-mode');
  win.innerHTML = LAUNCHER + `
    <div class="d-space" id="space">
      ${REMOTE('', '', { window: true, clock: '12:58 PM<br>10/7/2026' })}
      <div class="d-snap" id="snap"><div class="shot">${REMOTE('', '', { window: true, clock: '10:42 AM<br>10/4/2026' })}</div></div>
      <div class="d-tag" id="tag">
        <svg width="14" height="14" viewBox="0 0 14 14"><circle cx="7" cy="7" r="5.6" fill="none" stroke="white" stroke-width="1.4"/><path d="M7 4v3.2l2 1.3" fill="none" stroke="white" stroke-width="1.4" stroke-linecap="round"/></svg>
        Snapshot from your last session · Oct 4, 10:42 AM
      </div>
    </div>
    <div class="c-hud" id="hud">
      <div class="glyph" id="spinner"><i></i><i></i><i></i><i></i></div>
      <div class="text"><b>Resuming Desktop</b><span id="stageText"></span></div>
      <svg width="30" height="30" viewBox="0 0 30 30"><circle cx="15" cy="15" r="12" fill="none" stroke="rgba(255,255,255,.15)" stroke-width="3"/>
        <circle class="ring" id="ring" cx="15" cy="15" r="12" fill="none" stroke="#0a84ff" stroke-width="3" stroke-linecap="round"
          stroke-dasharray="75.4" stroke-dashoffset="75.4" transform="rotate(-90 15 15)"/></svg>
      <div class="connected"><span class="dot on"></span>Connected · 3456×2160 · 120 FPS</div>
    </div>`;
  const hud = $('#hud'), l = $('#launcher'), space = $('#space');
  at(500, () => $('#play').classList.add('pressed'));
  at(650, () => {
    $('#play').classList.remove('pressed');
    // The window lifts into a card, and the launcher fades straight into the
    // blurred snapshot of where you left off
    l.classList.add('lift-d');
    space.classList.add('lift');
    hud.classList.add('open');
    cycleStages($('#stageText'), 800);
    const order = [0, 1, 3, 2]; let k = 0;
    const panes = [...$('#spinner').children];
    every(220, () => { panes.forEach(p => p.classList.remove('lit')); panes[order[k % 4]].classList.add('lit'); panes[order[(k + 3) % 4]].classList.add('lit'); k++; });
    [0.2, 0.45, 0.68, 0.86, 1].forEach((p, i) => at(250 + i * 800, () => $('#ring').style.strokeDashoffset = 75.4 * (1 - p)));
  });
  at(1500, () => $('#tag').classList.add('in'));
  at(4900, () => {
    // First live frame: the card un-blurs and drops back down to fill the window,
    // dissolving into the live stream on the way
    intervals.forEach(clearInterval); intervals = [];
    hud.classList.add('done');
    $('#tag').classList.add('out');
    $('#snap').classList.add('live');
    space.classList.add('fill');
    at(450, () => $('#snap').classList.add('gone'));
    at(2400, () => hud.classList.add('gone'));
  });
}

const PLAYERS = { a: playA, b: playB, c: playC, d: playD };
let current = new URLSearchParams(location.search).get('v') || 'd';
let loop = null;

function play() {
  timers.forEach(clearTimeout); intervals.forEach(clearInterval); timers = []; intervals = [];
  clearTimeout(loop);
  win.className = 'window';
  win.innerHTML = '';
  win.insertAdjacentHTML('afterbegin', '');
  PLAYERS[current]();
  win.insertAdjacentHTML('beforeend', '<div class="traffic"><i></i><i></i><i></i></div>');
  document.getElementById('note').textContent = NOTES[current];
  document.querySelectorAll('#picker button').forEach(b => b.classList.toggle('on', b.dataset.v === current));
  loop = setTimeout(play, current === 'd' ? 11500 : 10500);
}

document.querySelectorAll('#picker button').forEach(b => b.onclick = () => { current = b.dataset.v; play(); });
document.getElementById('replay').onclick = play;

function fit() {
  const s = Math.min(1, (innerWidth - 40) / W, (innerHeight - 120) / H);
  document.getElementById('stage').style.transform = `translateX(-50%) scale(${s})`;
}
addEventListener('resize', fit);
fit();
play();
</script>
</body></html>
