---
name: Build - macOS
permissions:
  contents: read

on:
  workflow_call:
    inputs:
      ci_version:
        required: true
        type: string

jobs:
  build:
    env:
      CI_VERSION: ${{ inputs.ci_version }}
    runs-on: macos-26

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          submodules: 'recursive'
          fetch-depth: 1

      - name: Install build tools
        run: |
          brew install cmake ninja node
          npm install --global create-dmg

      - name: Build Package
        run: bash scripts/generate-dmg.sh Release

      - name: Upload Binaries
        uses: actions/upload-artifact@v6
        with:
          name: Moonlight-macOS-${{ env.CI_VERSION }}
          path: build/installer-Release/*.dmg
          compression-level: 0
          if-no-files-found: error

      - name: Upload Symbols
        uses: actions/upload-artifact@v6
        with:
          name: zDevDbgSyms-macOS-${{ env.CI_VERSION }}
          path: build/installer-Release/*.dSYM
          if-no-files-found: ignore
