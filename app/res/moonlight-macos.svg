<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Only basic shapes and gradients are used so this renders correctly with QtSvg (SVG Tiny) -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4B5FD6"/>
      <stop offset="0.55" stop-color="#25307A"/>
      <stop offset="1" stop-color="#0E1238"/>
    </linearGradient>
    <radialGradient id="glow" gradientUnits="userSpaceOnUse" cx="470" cy="500" r="420">
      <stop offset="0" stop-color="#9FB4FF" stop-opacity="0.5"/>
      <stop offset="0.6" stop-color="#6E83F0" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#6E83F0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="moon" gradientUnits="userSpaceOnUse" x1="330" y1="300" x2="640" y2="760">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.6" stop-color="#E9EDFF"/>
      <stop offset="1" stop-color="#B4BFF0"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.2"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Soft drop shadow (macOS icon grid: 824pt body on a 1024pt canvas) -->
  <rect x="96" y="116" width="832" height="832" rx="189" fill="#000000" fill-opacity="0.06"/>
  <rect x="98" y="112" width="828" height="828" rx="187" fill="#000000" fill-opacity="0.08"/>
  <rect x="100" y="108" width="824" height="824" rx="185" fill="#000000" fill-opacity="0.12"/>

  <!-- Body -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#sky)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#glow)"/>

  <!-- Stars -->
  <g fill="#FFFFFF">
    <circle cx="716" cy="690" r="7" fill-opacity="0.9"/>
    <circle cx="772" cy="420" r="5" fill-opacity="0.7"/>
    <circle cx="282" cy="262" r="4.5" fill-opacity="0.6"/>
    <circle cx="806" cy="560" r="3.5" fill-opacity="0.55"/>
    <circle cx="236" cy="752" r="3.5" fill-opacity="0.45"/>
    <path d="M736 196 Q741 240 780 245 Q741 250 736 294 Q731 250 692 245 Q731 240 736 196 Z" fill-opacity="0.95"/>
  </g>

  <!-- Crescent moon: outer circle (488,528) r236 minus inner circle (600,434) r204 -->
  <path d="M450.72 294.96 A236 236 0 1 0 711.04 605.13 A204 204 0 0 1 450.72 294.96 Z" fill="url(#moon)"/>

  <!-- Top sheen and hairline edge -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#sheen)"/>
  <rect x="101" y="101" width="822" height="822" rx="184" fill="none" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="2"/>
</svg>
